name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Một push mới lên cùng nhánh sẽ huỷ lượt chạy cũ còn dở -- không ai quan tâm
# kết quả của commit đã bị thay thế.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ant test (JDK 21)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Khớp javac.source/javac.target trong nbproject/project.properties.
          java-version: '21'

      # Ảnh runner của GitHub vốn có sẵn Ant, nhưng danh sách phần mềm cài sẵn
      # có thể đổi giữa các phiên bản ảnh -- tự cài khi thiếu để CI không đỏ vì
      # lý do chẳng liên quan gì tới code.
      - name: Ensure Ant is available
        run: |
          if ! command -v ant >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ant
          fi
          ant -version

      # web.xml/context.xml chỉ được đọc lúc Tomcat triển khai, nên một lỗi cú
      # pháp ở đó lọt qua cả `ant test` lẫn `ant compile-jsps` rồi mới làm hỏng
      # toàn bộ ứng dụng khi deploy. Đã dính đúng một lần: dấu "--" nằm trong
      # comment XML (không hợp lệ) khiến context /POSCS không khởi động được.
      # Dùng Python (có sẵn trên mọi ảnh runner) thay vì xmllint -- libxml2-utils
      # KHÔNG được cài sẵn, đã thử và fail bằng "command not found".
      - name: Check deployment descriptors are well-formed XML
        run: |
          python3 - <<'PY'
          import sys, xml.etree.ElementTree as ET
          failed = False
          for path in ("web/WEB-INF/web.xml", "web/META-INF/context.xml"):
              try:
                  ET.parse(path)
                  print(f"OK   {path}")
              except ET.ParseError as e:
                  print(f"LOI  {path}: {e}")
                  failed = True
          sys.exit(1 if failed else 0)
          PY

      # Đây là dự án NetBeans Ant, nên build-impl.xml mong đợi hai thứ mà IDE
      # thường tự cấp: classpath của Tomcat đã đăng ký, và jar CopyLibs nằm
      # trong thư mục cài NetBeans. Trên runner không có cái nào -- cả hai được
      # trỏ vào lib-build/ đã commit sẵn trong repo.
      - name: Run unit tests
        run: |
          ant -Dj2ee.platform.classpath="$GITHUB_WORKSPACE/lib-build/jakarta.servlet-api-6.1.jar" \
              -Dlibs.CopyLibs.classpath="$GITHUB_WORKSPACE/lib-build/org-netbeans-modules-java-j2seproject-copylibstask.jar" \
              test

      # Ant chỉ in "Tests FAILED" rồi dừng; muốn biết ca nào hỏng và vì sao thì
      # phải mở file XML, nên luôn tải lên kể cả khi build đỏ.
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: junit-results
          path: build/test/results/
          if-no-files-found: warn
