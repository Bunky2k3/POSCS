name: Tests

on:
  push:
    branches: [main]
  pull_request:

# Một push mới lên cùng nhánh sẽ huỷ lượt chạy cũ còn dở -- không ai quan tâm
# kết quả của commit đã bị thay thế.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ant test (JDK 21)
    runs-on: ubuntu-latest

    # MySQL thật cho các test tích hợp (poscs.integration.*). Không có service
    # này thì chúng tự SKIP -- CI vẫn xanh nhưng mất hẳn lớp kiểm tra bắt được
    # lỗi SQL/schema, đúng loại lỗi mà các test mock không thấy.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          # Tên PHẢI kết thúc bằng "_it": IntegrationDb từ chối chạy trên CSDL
          # không mang hậu tố đó, vì mỗi lượt chạy sẽ xoá sạch dữ liệu.
          MYSQL_DATABASE: poscs_it
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          # Khớp javac.source/javac.target trong nbproject/project.properties.
          java-version: '21'

      # Ảnh runner của GitHub vốn có sẵn Ant, nhưng danh sách phần mềm cài sẵn
      # có thể đổi giữa các phiên bản ảnh -- tự cài khi thiếu để CI không đỏ vì
      # lý do chẳng liên quan gì tới code.
      - name: Ensure Ant is available
        run: |
          if ! command -v ant >/dev/null; then
            sudo apt-get update && sudo apt-get install -y ant
          fi
          ant -version

      # web.xml/context.xml chỉ được đọc lúc Tomcat triển khai, nên một lỗi cú
      # pháp ở đó lọt qua cả `ant test` lẫn `ant compile-jsps` rồi mới làm hỏng
      # toàn bộ ứng dụng khi deploy. Đã dính đúng một lần: dấu "--" nằm trong
      # comment XML (không hợp lệ) khiến context /POSCS không khởi động được.
      # Dùng Python (có sẵn trên mọi ảnh runner) thay vì xmllint -- libxml2-utils
      # KHÔNG được cài sẵn, đã thử và fail bằng "command not found".
      - name: Check deployment descriptors are well-formed XML
        run: |
          python3 - <<'PY'
          import sys, xml.etree.ElementTree as ET
          failed = False
          for path in ("web/WEB-INF/web.xml", "web/META-INF/context.xml"):
              try:
                  ET.parse(path)
                  print(f"OK   {path}")
              except ET.ParseError as e:
                  print(f"LOI  {path}: {e}")
                  failed = True
          sys.exit(1 if failed else 0)
          PY

      # build-impl.xml do NetBeans SINH RA từ project.xml, nhưng cả hai đều được
      # commit -- nên nếu ai đó thêm jar vào project.xml mà không mở IDE cho nó
      # sinh lại (hoặc sinh lại rồi quên commit), jar sẽ nằm trong classpath biên
      # dịch nhưng KHÔNG được chép vào WEB-INF/lib. Code vẫn biên dịch được, test
      # vẫn xanh, và chỉ chết lúc chạy thật bằng NoClassDefFoundError.
      #
      # Đã dính đúng như vậy: 8 jar phụ thuộc của POI và PDFBox (log4j-api,
      # fontbox, pdfbox-io, commons-collections4...) nằm trong project.xml từ lúc
      # thêm chức năng xuất Excel/PDF nhưng chưa bao giờ vào WAR, nên toàn bộ
      # chức năng xuất file trả 500.
      - name: Check every declared library is copied into the WAR
        run: |
          python3 - <<'PYCHECK'
          import re, sys
          pat = re.compile(r"file[.]reference[.]([^}]+)")
          declared = set(pat.findall(open("nbproject/project.xml", encoding="utf-8").read()))
          copied = set()
          for line in open("nbproject/build-impl.xml", encoding="utf-8"):
              if "copyfiles" in line and "WEB-INF/lib" in line:
                  copied.update(pat.findall(line))
          missing = sorted(declared - copied)
          if missing:
              print("project.xml khai bao nhung build-impl.xml KHONG chep vao WAR:")
              for jar in missing:
                  print("  -", jar)
              print("")
              print("Mo project trong NetBeans de sinh lai build-impl.xml, roi commit ca hai file.")
              sys.exit(1)
          print("OK   %d thu vien deu duoc chep vao WEB-INF/lib" % len(declared))
          PYCHECK

      # Đây là dự án NetBeans Ant, nên build-impl.xml mong đợi hai thứ mà IDE
      # thường tự cấp: classpath của Tomcat đã đăng ký, và jar CopyLibs nằm
      # trong thư mục cài NetBeans. Trên runner không có cái nào -- cả hai được
      # test-sys-prop.* được build-impl.xml chuyển thành system property của JVM
      # test (xem <syspropertyset> trong macrodef junit). Phải đi đường này vì
      # biến môi trường không đặt được từ trong JVM, mà DBContext thì đọc
      # system property trước rồi mới tới biến môi trường.
      - name: Run unit and integration tests
        run: |
          ant -Dj2ee.platform.classpath="$GITHUB_WORKSPACE/lib-build/jakarta.servlet-api-6.1.jar" \
              -Dlibs.CopyLibs.classpath="$GITHUB_WORKSPACE/lib-build/org-netbeans-modules-java-j2seproject-copylibstask.jar" \
              -Dtest-sys-prop.DB_URL="jdbc:mysql://127.0.0.1:3306/poscs_it?allowPublicKeyRetrieval=true&useSSL=false" \
              -Dtest-sys-prop.DB_USER=root \
              -Dtest-sys-prop.DB_PASSWORD=ci-root-password \
              test

      # Test tích hợp tự SKIP khi không kết nối được CSDL -- rất tiện ở máy cá
      # nhân, nhưng trên CI thì "skip hết" nhìn y hệt "pass hết". Chốt lại là
      # chúng THẬT SỰ đã chạy, không thì MySQL service hỏng mà không ai biết.
      - name: Assert integration tests actually ran
        if: always()
        run: |
          python3 - <<'PYCHECK'
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob("build/test/results/*poscs.integration*.xml")
          if not files:
              print("KHONG thay ket qua cua poscs.integration -- test tich hop chua chay.")
              sys.exit(1)
          total = skipped = 0
          for f in files:
              root = ET.parse(f).getroot()
              total += int(root.get("tests", 0))
              skipped += int(root.get("skipped", 0))
          print("Integration: %d test, %d skipped" % (total, skipped))
          if total == 0 or skipped == total:
              print("Tat ca deu bi SKIP -- CSDL tich hop khong dung duoc.")
              sys.exit(1)
          PYCHECK

      # Ant chỉ in "Tests FAILED" rồi dừng; muốn biết ca nào hỏng và vì sao thì
      # phải mở file XML, nên luôn tải lên kể cả khi build đỏ.
      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: junit-results
          path: build/test/results/
          if-no-files-found: warn

  # Phần JS trước đây không có test nào, và đã trả giá: hai lỗi lọt qua cả
  # review lẫn CI rồi chỉ lộ khi mở trang thật (PR #136). Job riêng chứ không
  # ghép vào job ant: nó không cần JDK, không cần MySQL, chạy vài giây, và khi
  # đỏ thì tên job nói thẳng là hỏng ở JS chứ không phải ở Java.
  js:
    name: node --test (JS)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Bộ chạy test có sẵn của Node, không npm/package.json/node_modules --
      # đây là dự án Java, thêm một hệ sinh thái phụ thuộc nữa chỉ để chạy vài
      # chục assert là cái giá không đáng.
      #
      # Xuất thêm bản junit để bước sau đếm được, và để tải lên xem khi đỏ.
      - name: Run JS tests
        run: |
          mkdir -p build/test/results
          node --test                --test-reporter=spec --test-reporter-destination=stdout                --test-reporter=junit --test-reporter-destination=build/test/results/TEST-js.xml                'test/js/**/*.test.js'

      # node --test THOÁT 0 KHI KHÔNG TÌM THẤY FILE NÀO. Đổi tên thư mục test,
      # sửa nhầm đường dẫn, hay quên commit file test -- CI vẫn xanh y như khi
      # mọi thứ chạy tốt. Cùng lý do với bước "Assert integration tests actually
      # ran" ở job trên.
      - name: Assert JS tests actually ran
        if: always()
        run: |
          python3 - <<'PYCHECK'
          import sys
          try:
              xml = open("build/test/results/TEST-js.xml", encoding="utf-8").read()
          except OSError:
              print("KHONG thay build/test/results/TEST-js.xml -- test JS chua chay.")
              sys.exit(1)
          n = xml.count("<testcase")
          print("JS: %d test" % n)
          if n == 0:
              print("Khong co test nao chay -- kiem lai duong dan test/js/**/*.test.js")
              sys.exit(1)
          PYCHECK

      - name: Upload JS test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: js-test-results
          path: build/test/results/TEST-js.xml
          if-no-files-found: warn
